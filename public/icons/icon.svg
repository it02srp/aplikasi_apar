<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background rounded -->
  <rect width="512" height="512" rx="100" fill="#15803d"/>

  <!-- Fire extinguisher body -->
  <rect x="196" y="230" width="120" height="190" rx="22" fill="white"/>
  <!-- Tank top dome -->
  <ellipse cx="256" cy="230" rx="60" ry="24" fill="white"/>
  <!-- Neck -->
  <rect x="236" y="150" width="40" height="60" rx="10" fill="white"/>
  <!-- Valve head -->
  <rect x="220" y="138" width="72" height="24" rx="8" fill="white"/>
  <!-- Handle -->
  <rect x="292" y="140" width="48" height="10" rx="5" fill="white"/>
  <!-- Nozzle hose -->
  <path d="M196 270 Q150 270 140 310" stroke="white" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Nozzle tip -->
  <rect x="120" y="304" width="32" height="18" rx="6" fill="white"/>
  <!-- Stand / base -->
  <rect x="186" y="406" width="140" height="20" rx="10" fill="white" opacity="0.7"/>

  <!-- Flame spray (coming from nozzle) -->
  <ellipse cx="96" cy="313" rx="18" ry="10" fill="#fbbf24" opacity="0.9"/>
  <ellipse cx="76" cy="310" rx="12" ry="8" fill="#f97316" opacity="0.8"/>
</svg>
